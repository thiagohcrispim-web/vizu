name: Bundled vector engine tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      # Guarda o .7z do Inkscape já verificado (SHA-256) entre execuções; a chave muda junto com o SHA em VectorBundle.h.
      # Sem cache, o teste baixa de verdade de inkscape.org pelo mesmo código do app.
      - name: Engine archive cache key
        id: engine
        shell: bash
        run: echo "sha=$(grep -oP 'kSha256 = "\K[0-9a-f]{64}' VectorBundle.h)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vizu-engine-cache
          key: inkscape-engine-${{ steps.engine.outputs.sha }}
      - name: Compile bundle installation tests
        shell: cmd
        run: |
          if not exist build mkdir build
          cl /nologo /std:c++17 /utf-8 /EHsc /W4 /DUNICODE /D_UNICODE tests\vector_bundle_tests.cpp /Fe:build\bundle-tests.exe /link shlwapi.lib ole32.lib xmllite.lib advapi32.lib bcrypt.lib urlmon.lib winhttp.lib
      - name: Test download, installation, SVG/EPS conversion, reinstall and uninstall
        shell: cmd
        env:
          VIZU_TEST_ENGINE_CACHE: ${{ runner.temp }}\vizu-engine-cache\engine.7z
        run: |
          if not exist "%RUNNER_TEMP%\vizu-engine-cache" mkdir "%RUNNER_TEMP%\vizu-engine-cache"
          build\bundle-tests.exe
