name: tmp export installer
on:
  push:
    branches: [tmp-export-193]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix
      - uses: actions/cache@v4
        with:
          path: |
            build/cdr-src/*.tar.*
            build/cdr/libvizucdr.a
            build/pdfium
          key: cdr-pdfium-${{ hashFiles('build.sh', 'cdr/**') }}
      - run: ./build.sh
      - run: |
          f=$(ls dist/Vizu_Setup_19.5.3_x64.exe); sha256sum "$f"
          gzip -9c "$f" | base64 -w 76 | sed 's/^/B64:/'
