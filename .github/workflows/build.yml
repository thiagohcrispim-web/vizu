# .github/workflows/build.yml - CI/CD moderno com cache e matrix
name: Build Vizu

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows-static-md

jobs:
  # ------------------------------------------------------------
  # Build principal (Windows + Linux cross-compile)
  # ------------------------------------------------------------
  build:
    name: Build ${{ matrix.os }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows nativo (MSVC)
          - os: windows-latest
            config: Release
            generator: "Visual Studio 17 2022"
            arch: x64
            triplet: x64-windows-static-md
            artifact: Vizu.exe

          # Windows nativo (MinGW)
          - os: windows-latest
            config: Release
            generator: "MinGW Makefiles"
            arch: x64
            triplet: x64-windows-static-md
            artifact: Vizu.exe

          # Linux cross-compile (MinGW)
          - os: ubuntu-latest
            config: Release
            generator: "Unix Makefiles"
            arch: x64
            triplet: x64-windows-static
            artifact: Vizu.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        if: runner.os != 'Linux' || matrix.os == 'ubuntu-latest'
        with:
          vcpkgDirectory: '${{ env.VCPKG_ROOT }}'
          vcpkgTriplet: '${{ matrix.triplet }}'
          vcpkgArguments: '--feature-flags=versions,manifests'
          appendedCacheKey: "${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake ninja-build

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/installed
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-

      - name: Configure CMake
        run: |
          cmake -B build -G "${{ matrix.generator }}" \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_INSTALL_PREFIX=install \
            -DVIZU_USE_VCPKG=ON \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        run: |
          cd build
          ctest -C ${{ matrix.config }} --output-on-failure --parallel

      - name: Package
        run: |
          cmake --build build --config ${{ matrix.config }} --target package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vizu-${{ matrix.os }}-${{ matrix.config }}
          path: |
            build/*.exe
            build/*.msi
            build/*.zip
          retention-days: 7

  # ------------------------------------------------------------
  # Vector conversion tests
  # ------------------------------------------------------------
  vector-tests:
    name: Vector Tests
    runs-on: windows-latest
    timeout-minutes: 20
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ env.VCPKG_ROOT }}'
          vcpkgTriplet: 'x64-windows-static-md'
          vcpkgArguments: '--feature-flags=versions,manifests'

      - name: Download Inkscape (cached)
        id: inkscape
        uses: actions/cache@v4
        with:
          path: inkscape-portable
          key: inkscape-1.3.2-${{ hashFiles('VectorBundle.cpp') }}

      - name: Install Inkscape
        if: steps.inkscape.outputs.cache-hit != 'true'
        run: |
          mkdir inkscape-portable
          curl -L -o inkscape.zip "https://inkscape.org/gallery/item/47030/Inkscape-1.3.2-x64.7z"
          7z x inkscape.zip -oinkscape-portable
          # Verifica SHA-256
          certutil -hashfile inkscape-portable/inkscape.exe SHA256

      - name: Build
        run: |
          cmake -B build -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Run vector tests
        run: |
          cd build
          ctest -C Release -R "vector" --output-on-failure

      - name: Run CDR tests
        run: |
          cd build
          ctest -C Release -R "cdr" --output-on-failure

  # ------------------------------------------------------------
  # Bundled vector engine tests (Ultra edition)
  # ------------------------------------------------------------
  bundled-engine-tests:
    name: Bundled Engine Tests
    runs-on: windows-latest
    timeout-minutes: 30
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ env.VCPKG_ROOT }}'
          vcpkgTriplet: 'x64-windows-static-md'

      - name: Build Ultra
        run: |
          cmake -B build -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release -DVIZU_EDITION=Ultra
          cmake --build build --config Release --parallel

      - name: Test vector engine
        run: |
          cd build
          ctest -C Release -R "bundled" --output-on-failure

  # ------------------------------------------------------------
  # Preview smoke test
  # ------------------------------------------------------------
  preview-smoke:
    name: Preview Smoke Test
    runs-on: windows-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Vizu-windows-latest-Release
          path: artifacts

      - name: Install Vizu
        run: |
          ./artifacts/Vizu_Setup_*.exe /S

      - name: Test thumbnail provider registration
        run: |
          reg query HKCU\Software\Classes\CLSID\{9E85547E-13C6-4C5E-95CC-990C74D9BB3F}

      - name: Test preview handler registration
        run: |
          reg query HKCU\Software\Classes\CLSID\{8895b1c6-b41f-4c1c-a562-0d564250836f}

      - name: Run preview test
        run: |
          powershell -Command "
            Add-Type -AssemblyName System.Windows.Forms
            $form = New-Object System.Windows.Forms.Form
            $form.Size = New-Object System.Drawing.Size(800,600)
            $preview = New-Object System.Windows.Forms.Integration.ElementHost
            $preview.Dock = 'Fill'
            $form.Controls.Add($preview)
            $form.Show()
            Start-Sleep 2
            $form.Close()
          "

  # ------------------------------------------------------------
  # Release
  # ------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, vector-tests, bundled-engine-tests, preview-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Vizu-*-Release
          merge-multiple: true

      - name: Verify SHA-256
        run: |
          for f in artifacts/*.exe; do
            sha256sum "$f" > "${f}.sha256"
            cat "${f}.sha256"
          done

      - name: Update latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          INSTALLER="Vizu_Setup_${VERSION}_x64.exe"
          SHA256=$(sha256sum "artifacts/${INSTALLER}" | cut -d' ' -f1)
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "url": "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${INSTALLER}",
            "sha256": "${SHA256}"
          }
          EOF
          cat latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*.exe
            artifacts/*.msi
            artifacts/*.sha256
            latest.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------
  # Dependency review
  # ------------------------------------------------------------
  deps-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@v3
        with:
          config-file: '.github/dependency-review.yml'
          fail-on-severity: high