# Compila o DesignThumbs a cada envio e publica o instalador como artefato.
# Base para a assinatura gratuita da SignPath Foundation (builds automatizados e verificáveis).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar MinGW
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix

      - name: Compilar
        run: ./build.sh

      # Leitores de arquivo (PSD, ZIP) e comparação de versão: arquivo corrompido falha sem derrubar o programa.
      - name: Testar leitores de arquivo
        run: |
          sudo apt-get install -y wine64
          x86_64-w64-mingw32-g++ -O2 -DUNICODE -D_UNICODE -static -municode -Ithird_party/mingw-w64-headers -o build/format-tests.exe tests/format_tests.cpp -lshlwapi -lole32 -loleaut32 -luuid -lgdi32 -ld2d1 -ldwrite -lwindowscodecs -lruntimeobject -lshcore -lwinhttp -lurlmon -lbcrypt -lxmllite
          WINEDEBUG=-all timeout 120 wine build/format-tests.exe # timeout: um laço travado falha em vez de prender o job

      - name: Publicar artefato
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: DesignThumbs-Setup
          path: dist/Vizu_Setup_*_x64.exe
          if-no-files-found: error

      # Depois da aprovação na SignPath Foundation, descomente e preencha os IDs do projeto
