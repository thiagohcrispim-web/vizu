# Compila o DesignThumbs a cada envio e publica o instalador como artefato.
# Base para a assinatura gratuita da SignPath Foundation (builds automatizados e verificáveis).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Pré-teste: barra em segundos os erros que já aconteceram (regras em .github/precheck/regras.txt)
      - name: Pré-teste
        run: python3 .github/scripts/precheck.py

      - name: Instalar MinGW
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix

      # Fontes do leitor de CorelDRAW (com SHA-256 conferido no build.sh) e a biblioteca já compilada.
      - uses: actions/cache@v4
        with:
          path: |
            build/cdr-src/*.tar.*
            build/cdr/libvizucdr.a
            build/pdfium
          key: cdr-pdfium-${{ hashFiles('build.sh', 'cdr/**') }}

      - name: Compilar
        run: ./build.sh

      # Leitores de arquivo (PSD, ZIP) e comparação de versão: arquivo corrompido falha sem derrubar o programa.
      - name: Testar leitores de arquivo
        run: |
          sudo apt-get install -y wine64
          x86_64-w64-mingw32-g++ -O2 -DUNICODE -D_UNICODE -static -municode -Ithird_party/mingw-w64-headers -o build/format-tests.exe tests/format_tests.cpp -lshlwapi -lole32 -loleaut32 -luuid -lgdi32 -ld2d1 -ldwrite -lwindowscodecs -lruntimeobject -lshcore -lwinhttp -lurlmon -lbcrypt -lxmllite
          WINEDEBUG=-all timeout 120 wine build/format-tests.exe # timeout: um laço travado falha em vez de prender o job

      # Limpeza: só sai o que pode sair; nada fora do perfil, nenhum destino de link, nada em uso.
      - name: Testar a Limpeza
        run: |
          x86_64-w64-mingw32-g++ -O2 -DUNICODE -D_UNICODE -static -municode -Ithird_party/mingw-w64-headers -o build/clean-tests.exe tests/clean_tests.cpp -lshell32 -lole32 -luuid
          WINEDEBUG=-all timeout 120 wine build/clean-tests.exe

      # Gravar tela: relógio com pausa, áudio alinhado (silêncio do loopback), mixagem sem estouro, nome do arquivo.
      - name: Testar a gravação de tela
        run: |
          x86_64-w64-mingw32-g++ -O2 -std=c++20 -DUNICODE -D_UNICODE -static -municode -Ithird_party/mingw-w64-headers -o build/record-tests.exe tests/record_tests.cpp -ld3d11 -ldxgi -lmfplat -lmfreadwrite -lmfuuid -lole32 -luuid -lgdi32 -lshell32
          WINEDEBUG=-all timeout 120 wine build/record-tests.exe

      # PDF -> PPT: texto editável, vetores no fundo, texto girado no fundo, Form XObject, camada de scan.
      - name: Testar PDF para PPT
        run: |
          (cd tests && x86_64-w64-mingw32-windres -c 65001 pptx_tests.rc -O coff -o ../build/pptx_tests.res.o)
          x86_64-w64-mingw32-g++ -O2 -DUNICODE -D_UNICODE -static -municode -Ithird_party/mingw-w64-headers -o build/pptx-tests.exe tests/pptx_tests.cpp build/pptx_tests.res.o -lshlwapi -lole32 -loleaut32 -luuid -lgdi32 -ld2d1 -ldwrite -lwindowscodecs -lruntimeobject -lshcore
          WINEDEBUG=-all timeout 300 wine build/pptx-tests.exe

      # Word/Excel/PowerPoint -> PDF: tipos, chamadas COM por nome e mensagem sem Office/LibreOffice.
      - name: Testar Office para PDF
        run: |
          x86_64-w64-mingw32-g++ -O2 -DUNICODE -D_UNICODE -static -municode -Ithird_party/mingw-w64-headers -o build/office-tests.exe tests/office_tests.cpp -lshlwapi -lole32 -loleaut32 -luuid -lshell32
          WINEDEBUG=-all timeout 120 wine build/office-tests.exe

      # CorelDRAW sem Inkscape: CDR/CMX reais para PDF, PNG e SVG; arquivo malformado recusado; degradê, texto e imagem.
      - name: Testar CorelDRAW
        run: |
          C=build/cdr-src
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -DUNICODE -D_UNICODE -static -municode -Ithird_party/mingw-w64-headers -I$C/libcdr-0.1.9/inc -I$C/librevenge-0.0.6/inc -I$C/zlib-1.3.1 -o build/cdr-tests.exe tests/cdr_tests.cpp build/pptx_tests.res.o build/webp/libwebp.a build/cdr/libvizucdr.a -lshlwapi -lole32 -loleaut32 -luuid -lgdi32 -ld2d1 -ldwrite -lwindowscodecs -lruntimeobject -lshcore -lshell32 -lwinhttp -lurlmon -lbcrypt -lxmllite
          WINEDEBUG=-all timeout 300 wine build/cdr-tests.exe

      - name: Publicar artefato
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: DesignThumbs-Setup
          path: dist/Vizu_Setup_*_x64.exe
          if-no-files-found: error

      # Depois da aprovação na SignPath Foundation, descomente e preencha os IDs do projeto
