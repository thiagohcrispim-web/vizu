# .github/workflows/release.yml - Release automation (conforme CLAUDE.md)
name: Publish Vizu Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex: 9.14.5)'
        required: true
        type: string
      edition:
        description: 'Edição para build'
        required: true
        type: choice
        options: [Lite, Vizu, Ultra]
        default: Ultra

permissions:
  contents: write

jobs:
  release:
    name: Build and Release ${{ github.event.inputs.version }} (${{ github.event.inputs.edition }})
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão inválida: $VERSION (esperado: X.Y.Z)"
            exit 1
          fi
          # Verifica se tag já existe
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION já existe!"
            exit 1
          fi

      - name: Update version in sources
        run: |
          VERSION="${{ github.event.inputs.version }}"
          EDITION="${{ github.event.inputs.edition }}"

          # Atualiza CMakeLists.txt
          sed -i "s/VERSION 9\.14\.4/VERSION $VERSION/" CMakeLists.txt
          sed -i "s/VIZU_VERSION_MAJOR=9/VIZU_VERSION_MAJOR=$(echo $VERSION | cut -d. -f1)/" CMakeLists.txt
          sed -i "s/VIZU_VERSION_MINOR=14/VIZU_VERSION_MINOR=$(echo $VERSION | cut -d. -f2)/" CMakeLists.txt
          sed -i "s/VIZU_VERSION_PATCH=4/VIZU_VERSION_PATCH=$(echo $VERSION | cut -d. -f3)/" CMakeLists.txt
          sed -i "s/VIZU_VERSION_STRING=\"9.14.4\"/VIZU_VERSION_STRING=\"$VERSION\"/" CMakeLists.txt

          # Atualiza Vizu.rc (FILEVERSION e PRODUCTVERSION)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          sed -i "s/FILEVERSION 9,14,4,0/FILEVERSION $MAJOR,$MINOR,$PATCH,0/" Vizu.rc
          sed -i "s/PRODUCTVERSION 9,14,4,0/PRODUCTVERSION $MAJOR,$MINOR,$PATCH,0/" Vizu.rc
          sed -i "s/VALUE \"FileVersion\", \"9.14.4\"/VALUE \"FileVersion\", \"$VERSION\"/" Vizu.rc
          sed -i "s/VALUE \"ProductVersion\", \"9.14.4\"/VALUE \"ProductVersion\", \"$VERSION\"/" Vizu.rc

          # Atualiza vcpkg.json
          sed -i "s/\"version\": \"9.14.4\"/\"version\": \"$VERSION\"/" vcpkg.json

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgTriplet: 'x64-windows-static-md'
          vcpkgArguments: '--feature-flags=versions,manifests'

      - name: Cache Inkscape
        uses: actions/cache@v4
        with:
          path: inkscape-portable
          key: inkscape-1.3.2

      - name: Download Inkscape (if not cached)
        if: steps.cache-inkscape.outputs.cache-hit != 'true'
        run: |
          mkdir inkscape-portable
          curl -L -o inkscape.7z "https://inkscape.org/gallery/item/47030/Inkscape-1.3.2-x64.7z"
          7z x inkscape.7z -oinkscape-portable
          # Verifica SHA-256 conhecido
          $EXPECTED_SHA = "a1b2c3d4e5f6..." # Atualizar com SHA real
          $ACTUAL_SHA = (Get-FileHash inkscape-portable/inkscape.exe -Algorithm SHA256).Hash.ToLower()
          if ($ACTUAL_SHA -ne $EXPECTED_SHA) {
            Write-Error "SHA-256 do Inkscape não confere!"
            exit 1
          }

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install \
            -DVIZU_USE_VCPKG=ON \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: |
          cd build
          ctest -C Release --output-on-failure --parallel

      - name: Create installer
        run: |
          cmake --build build --config Release --target package

      - name: Verify installer
        run: |
          $INSTALLER = Get-ChildItem build/Vizu_Setup_*.exe | Select-Object -First 1
          if (-not $INSTALLER) {
            Write-Error "Instalador não encontrado!"
            exit 1
          }
          $SHA256 = (Get-FileHash $INSTALLER.FullName -Algorithm SHA256).Hash.ToLower()
          echo "Installer: $($INSTALLER.Name)"
          echo "SHA-256: $SHA256"
          echo "INSTALLER_PATH=$($INSTALLER.FullName)" >> $GITHUB_ENV
          echo "INSTALLER_NAME=$($INSTALLER.Name)" >> $GITHUB_ENV
          echo "INSTALLER_SHA256=$SHA256" >> $GITHUB_ENV

      - name: Update latest.json
        run: |
          VERSION="${{ github.event.inputs.version }}"
          INSTALLER="${{ env.INSTALLER_NAME }}"
          SHA256="${{ env.INSTALLER_SHA256 }}"
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "url": "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${INSTALLER}",
            "sha256": "${SHA256}"
          }
          EOF
          cat latest.json

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt Vizu.rc vcpkg.json latest.json
          git commit -m "chore: release v${{ github.event.inputs.version }}"
          git tag "v${{ github.event.inputs.version }}"
          git push origin main --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Vizu ${{ github.event.inputs.version }}
          files: |
            ${{ env.INSTALLER_PATH }}
            latest.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release
        run: |
          # Verifica se release foi criada
          gh release view "v${{ github.event.inputs.version }}" --json assets --jq '.assets[].name'
          # Verifica se latest.json está correto
          gh release download "v${{ github.event.inputs.version }}" -p latest.json
          cat latest.json