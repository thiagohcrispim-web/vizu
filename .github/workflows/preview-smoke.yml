# Abre a prévia no Windows de verdade e confere que o Vizu continua aberto.
# Não bloqueia a publicação; serve para pegar fechamentos que só acontecem no Windows.
name: Preview smoke test
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vizu-smoke
          path: |
            dist/Vizu_Setup_*_x64.exe
            build/Vizu.map
          if-no-files-found: error
  preview:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vizu-smoke
      - name: Instalar e abrir prévias
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          $dir = Join-Path $env:RUNNER_TEMP 'amostras'
          New-Item -ItemType Directory -Force $dir | Out-Null
          foreach ($i in 1..6) {
            $bmp = New-Object System.Drawing.Bitmap 1600, 1000
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(255, 40 * $i, 120, 200))
            $g.Dispose()
            $bmp.Save((Join-Path $dir "foto$i.png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Save((Join-Path $dir "foto$i.jpg"), [System.Drawing.Imaging.ImageFormat]::Jpeg)
            $bmp.Dispose()
            '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200"><rect width="400" height="200" fill="#f63"/><circle cx="100" cy="100" r="60"/><text x="200" y="110" font-size="40">Vizu</text></svg>' | Set-Content (Join-Path $dir "desenho$i.svg")
          }
          $log = Join-Path $env:LOCALAPPDATA 'DesignThumbs\crash.log'
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\DesignThumbs\Vizu.exe'
          $failed = $false
          # Traduz "+0x1234" em nome de função usando o mapa do build
          $map = [regex]::Matches((Get-Content build\Vizu.map -Raw), '\.text\$(\S+)\s+0x([0-9a-f]{16})\s+0x([0-9a-f]+)') | ForEach-Object {
            [pscustomobject]@{ Name = $_.Groups[1].Value; Start = [Convert]::ToUInt64($_.Groups[2].Value, 16); Size = [Convert]::ToUInt64($_.Groups[3].Value, 16) } }
          function Resolve($text) {
            [regex]::Matches($text, '\+0x([0-9a-fA-F]+)') | ForEach-Object {
              $a = 0x140000000 + [Convert]::ToUInt64($_.Groups[1].Value, 16)
              $hit = $map | Where-Object { $a -ge $_.Start -and $a -lt $_.Start + $_.Size } | Select-Object -First 1
              if ($hit) { Write-Host ("  +0x{0:X} {1} (+0x{2:X} dentro da funcao)" -f ($a - 0x140000000), $hit.Name, ($a - $hit.Start)) }
            }
          }
          function Stacks($name) {
            $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
            Get-Process | Where-Object MainWindowTitle | ForEach-Object { Write-Host "janela: $($_.ProcessName) - $($_.MainWindowTitle)" }
            $p = Get-Process $name -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $p) { Write-Host "$name nao esta rodando"; return }
            if (-not (Test-Path $cdb)) { Write-Host 'cdb nao encontrado'; return }
            $out = & $cdb -pv -p $p.Id -c '~*kn 30;q' 2>&1 | Out-String
            ($out -split "`n") | Where-Object { $_ -match '^\s*[0-9a-f]+ |Id: ' } | Select-Object -First 160 | ForEach-Object { Write-Host $_ }
            Write-Host 'funcoes do Vizu nas pilhas:'; Resolve ($out -replace 'Vizu_Setup\+0x', '+0x' -replace 'Vizu\+0x', '+0x')
          }
          function Check($step) {
            if (Test-Path $log) { Write-Host "::error::$step - o Vizu fechou sozinho"; $c = Get-Content $log -Raw; Write-Host $c; Resolve $c; Remove-Item $log; $script:failed = $true }
            if (-not (Get-Process Vizu -ErrorAction SilentlyContinue)) {
              Write-Host "::error::$step - o Vizu nao esta mais aberto"; $script:failed = $true
              if (Test-Path $exe) { Start-Process $exe; Start-Sleep 5 }
            } else { Write-Host "ok: $step" }
          }
          # -Wait esperaria também o Vizu que o instalador abre no fim; espera só o instalador
          $installer = Get-ChildItem -Recurse -Filter 'Vizu_Setup_*_x64.exe' | Select-Object -First 1
          $setup = Start-Process $installer.FullName -ArgumentList '/S', '/update' -PassThru
          if (-not $setup.WaitForExit(60000)) { Write-Host '::error::instalador silencioso nao terminou em 60 s'; $failed = $true; Stacks $setup.ProcessName; Stop-Process -Id $setup.Id -Force }
          Get-ChildItem (Split-Path $exe) -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "instalado: $($_.Name) $($_.Length)" }
          Start-Sleep 8
          Check 'instalar e iniciar'
          foreach ($f in 'foto1.png', 'foto2.jpg', 'desenho1.svg', 'desenho3.svg', 'desenho4.svg') {
            Start-Process $exe -ArgumentList '/peek', "`"$(Join-Path $dir $f)`""
            Start-Sleep 20
            Check "previa de $f (linha de comando)"
          }
          # Como o usuario faz: Explorer, arquivo selecionado, Espaco
          foreach ($f in 'foto3.png', 'foto4.jpg', 'desenho2.svg') {
            Start-Process explorer.exe -ArgumentList "/select,`"$(Join-Path $dir $f)`""
            Start-Sleep 8
            [System.Windows.Forms.SendKeys]::SendWait(' ')
            Start-Sleep 25
            Check "Espaco no Explorer em $f"
            [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
            Start-Sleep 2
          }
          Get-EventLog -LogName Application -Source 'Application Error' -Newest 5 -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'Vizu' } | ForEach-Object { Write-Host $_.Message }
          if ($failed) { exit 1 }
